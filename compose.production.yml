services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-23hotel}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
      TZ: Asia/Yangon
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-23hotel}
      NODE_ENV: production
      AUTH_OTP_MODE: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  uploads:
